# ============================================================
# Backlog 変更記録 設定ファイル
# ============================================================
# このファイルをコピーして config.yaml を作成してください。
#
#   cp config.example.yaml config.yaml
#
# API キーはここには書きません。環境変数 BACKLOG_API_KEY か、
# リポジトリ直下の .env に BACKLOG_API_KEY=... の形で置いてください。
# ============================================================

backlog:
  # スペースのホスト名（クラウド版の例: yourcompany.backlog.com）
  space_host: "yourcompany.backlog.com"

  # オンプレミス版でパスプレフィックスがある場合に指定（例: "/backlog"）
  base_path: ""

  # SSL 証明書の検証。自己署名証明書のクローズド環境では false
  ssl_verify: true

target:
  # 変更の記録を残す課題。この課題自身の変更は記録の対象から外す。
  # コメントの記法（マークダウン / Backlog 記法）は、この課題のプロジェクトに合わせる。
  issue_key: "PROJ-1"

  # 追跡するプロジェクトのキー。1 日 1 件のコメントに、プロジェクトごとに見出しを分けて載せる。
  # 省略すると、記録先の課題のプロジェクトだけを追跡する。
  # 記録先の課題のプロジェクトも追跡するなら、ここに書く（書かなければ追跡しない）。
  # project_keys:
  #   - PROJ
  #   - SUPPORT
