# ============================================================
# Backlog 変更記録ツール 設定ファイル
# ============================================================
# このファイルをコピーして config.yaml を作成してください。
# config.yaml は .gitignore で除外されています（API キーを含むため）。
#
#   cp config.example.yaml config.yaml
#
# 依存ライブラリのインストール:
#   .venv/bin/pip install pyyaml
#
# API キーは、環境変数 BACKLOG_API_KEY や .env に置くこともできます。
# 探す順は 環境変数 → config.yaml の api_key → .env です。
#
# menu.py（対話メニュー）から使う場合も、このファイルを読みます。
# 記録先の課題や追跡するプロジェクトは、メニューでは指定しません。
#
# 各項目の詳細は README.md を参照してください。
# ============================================================

# ------------------------------------------------------------
# Backlog 接続設定
# ------------------------------------------------------------
backlog:
  space_host: "yourcompany.backlog.com"  # スペースのホスト名（例: myteam.backlog.com）
  api_key: "YOUR_API_KEY_HERE"           # Backlog API キー（個人設定 → API から取得）
  ssl_verify: true                       # SSL 証明書検証（オンプレ版で false にする場合あり）
  base_path: ""                          # オンプレ版のパスプレフィックス（例: "/backlog"）

# ------------------------------------------------------------
# 記録の設定
# ------------------------------------------------------------
target:
  # 変更の記録を残す課題の課題キー（例: PROJ-1）
  # 前日までの変更を、この課題に 1 日 1 件のコメントとして投稿します。
  # この課題自身の変更は、記録の対象から外します。
  # コメントの記法（マークダウン / Backlog 記法）は、この課題のプロジェクトの設定に合わせます。
  issue_key: "PROJ-1"

  # 追跡するプロジェクトのキー（省略可）
  # 複数並べると、1 日 1 件のコメントの中でプロジェクトごとに見出しを分けて載せます。
  # 省略すると、記録先の課題のプロジェクトだけを追跡します。
  # 記録先の課題のプロジェクトも追跡する場合は、ここに書いてください（書かなければ追跡しません）。
  # どれか 1 つのプロジェクトで変更が欠けているかもしれない日は、その日ごと投稿しません。
  # 存在するキーかどうかは check_api.py で確かめられます。
  #   .venv/bin/python check_api.py
  # project_keys:
  #   - PROJ
  #   - SUPPORT
